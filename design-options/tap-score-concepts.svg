<svg xmlns="http://www.w3.org/2000/svg" width="1590" height="670" viewBox="0 0 1590 670" role="img" aria-labelledby="title desc">
  <title id="title">Three score-as-tap-target concepts for Tennis Score</title>
  <desc id="desc">Three round watch screens show set two, a completed first set, three games to two, and points thirty to fifteen. A uses colored side by side score tiles, B splits one dark score panel into two halves, and C uses stacked full width score rows. Each has Undo at the bottom.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .heading { fill: #f5f7f6; font-size: 25px; font-weight: 750; }
      .caption { fill: #a8b5b4; font-size: 16px; }
      .watch { fill: #121718; stroke: #555a59; stroke-width: 20; }
      .set { fill: #d4e0de; font-size: 19px; font-weight: 650; letter-spacing: 1px; }
      .sets { fill: #bccac7; font-size: 16px; font-weight: 650; }
      .games { fill: #f7f8f8; font-size: 23px; font-weight: 750; }
      .name { font-size: 20px; font-weight: 800; letter-spacing: .6px; }
      .points { font-size: 91px; font-weight: 850; letter-spacing: -4px; }
      .hint { font-size: 15px; font-weight: 750; letter-spacing: 1px; }
      .undo { fill: #f2f5f4; font-size: 20px; font-weight: 750; }
    </style>
    <g id="ball"><circle r="9" fill="#c9fb81"/><path d="M-6 -7 Q1 0 -6 7 M6 -7 Q-1 0 6 7" fill="none" stroke="#61873e" stroke-width="1.5"/></g>
  </defs>
  <rect width="1590" height="670" fill="#202323"/>
  <text x="38" y="43" fill="#f5f7f6" font-size="30" font-weight="780">Tap the score to award a point</text>
  <text x="38" y="71" class="caption">Same match state in each: set 2 of 3 · first set 6–4 · current games 3–2 · points 30–15</text>

  <!-- A: independent score targets -->
  <g transform="translate(0 0)">
    <text x="265" y="120" text-anchor="middle" class="heading">A · Separate score tiles</text>
    <text x="265" y="145" text-anchor="middle" class="caption">Recommended: clearest tap boundary</text>
    <circle cx="265" cy="400" r="230" class="watch"/>
    <text x="265" y="234" text-anchor="middle" class="set">SET 2 OF 3</text>
    <text x="265" y="259" text-anchor="middle" class="sets">S1  <tspan fill="#adf1bb" font-weight="850">6</tspan>–4</text>
    <use href="#ball" x="168" y="292"/>
    <text x="183" y="300" class="games">YOU 3</text>
    <path d="M265 278 V307" stroke="#63706e" stroke-width="1.5"/>
    <text x="294" y="300" class="games">OPP 2</text>
    <rect x="92" y="327" width="166" height="180" rx="31" fill="#a8edb7"/>
    <rect x="272" y="327" width="166" height="180" rx="31" fill="#ffc497"/>
    <text x="175" y="362" text-anchor="middle" class="name" fill="#173027">YOU</text>
    <text x="355" y="362" text-anchor="middle" class="name" fill="#36271f">OPP</text>
    <text x="175" y="460" text-anchor="middle" class="points" fill="#142921">30</text>
    <text x="355" y="460" text-anchor="middle" class="points" fill="#33241c">15</text>
    <text x="175" y="489" text-anchor="middle" class="hint" fill="#254838">TAP +1</text>
    <text x="355" y="489" text-anchor="middle" class="hint" fill="#573d2c">TAP +1</text>
    <rect x="189" y="527" width="152" height="46" rx="23" fill="none" stroke="#b4c2be" stroke-width="2"/>
    <text x="265" y="557" text-anchor="middle" class="undo">↶  UNDO</text>
  </g>

  <!-- B: one score pill with two hit zones -->
  <g transform="translate(530 0)">
    <text x="265" y="120" text-anchor="middle" class="heading">B · Split center score</text>
    <text x="265" y="145" text-anchor="middle" class="caption">Closest to the current layout</text>
    <circle cx="265" cy="400" r="230" class="watch"/>
    <text x="265" y="234" text-anchor="middle" class="set">SET 2 OF 3</text>
    <text x="265" y="259" text-anchor="middle" class="sets">S1  <tspan fill="#adf1bb" font-weight="850">6</tspan>–4</text>
    <use href="#ball" x="168" y="292"/>
    <text x="183" y="300" class="games">YOU 3</text>
    <path d="M265 278 V307" stroke="#63706e" stroke-width="1.5"/>
    <text x="294" y="300" class="games">OPP 2</text>
    <rect x="81" y="327" width="368" height="178" rx="33" fill="#242a29" stroke="#74827f" stroke-width="2"/>
    <path d="M265 327 V505" stroke="#74827f" stroke-width="2"/>
    <text x="173" y="361" text-anchor="middle" class="name" fill="#a8edb7">YOU +</text>
    <text x="357" y="361" text-anchor="middle" class="name" fill="#ffc497">OPP +</text>
    <text x="173" y="459" text-anchor="middle" class="points" fill="#f7faf8">30</text>
    <text x="357" y="459" text-anchor="middle" class="points" fill="#f7faf8">15</text>
    <text x="173" y="486" text-anchor="middle" class="hint" fill="#a8edb7">TAP</text>
    <text x="357" y="486" text-anchor="middle" class="hint" fill="#ffc497">TAP</text>
    <rect x="189" y="527" width="152" height="46" rx="23" fill="none" stroke="#b4c2be" stroke-width="2"/>
    <text x="265" y="557" text-anchor="middle" class="undo">↶  UNDO</text>
  </g>

  <!-- C: stacked full-width targets -->
  <g transform="translate(1060 0)">
    <text x="265" y="120" text-anchor="middle" class="heading">C · Stacked score rows</text>
    <text x="265" y="145" text-anchor="middle" class="caption">Largest individual tap areas</text>
    <circle cx="265" cy="400" r="230" class="watch"/>
    <text x="265" y="230" text-anchor="middle" class="set">SET 2 OF 3</text>
    <text x="265" y="253" text-anchor="middle" class="sets">S1  <tspan fill="#adf1bb" font-weight="850">6</tspan>–4</text>
    <rect x="94" y="275" width="342" height="111" rx="29" fill="#a8edb7"/>
    <use href="#ball" x="134" y="312"/>
    <text x="153" y="319" class="name" fill="#173027">YOU <tspan font-size="16" font-weight="650">· GAMES 3</tspan></text>
    <text x="151" y="366" fill="#173027" font-size="16" font-weight="750">TAP TO SCORE</text>
    <text x="386" y="366" text-anchor="end" fill="#142921" font-size="67" font-weight="850">30</text>
    <rect x="94" y="397" width="342" height="111" rx="29" fill="#ffc497"/>
    <text x="133" y="440" class="name" fill="#36271f">OPP <tspan font-size="16" font-weight="650">· GAMES 2</tspan></text>
    <text x="133" y="487" fill="#573d2c" font-size="16" font-weight="750">TAP TO SCORE</text>
    <text x="386" y="487" text-anchor="end" fill="#33241c" font-size="67" font-weight="850">15</text>
    <rect x="189" y="527" width="152" height="46" rx="23" fill="none" stroke="#b4c2be" stroke-width="2"/>
    <text x="265" y="557" text-anchor="middle" class="undo">↶  UNDO</text>
  </g>
</svg>
